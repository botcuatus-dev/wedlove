<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trung Thu</title>
    <!-- Google Fonts & FontAwesome -->
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030208;
            font-family: 'Quicksand', sans-serif;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .top-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: rgba(255, 215, 0, 0.3);
        }

        .wish-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
        }

        .wish-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .wish-card {
            background: linear-gradient(135deg, rgba(35, 15, 45, 0.92), rgba(15, 8, 25, 0.95));
            border: 1.5px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 35px rgba(255, 182, 193, 0.3), inset 0 0 15px rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            padding: 30px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            position: relative;
            transform: translateY(30px) scale(0.9);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #fff;
        }

        .wish-modal.active .wish-card {
            transform: translateY(0) scale(1);
        }

        .wish-card .close-btn {
            z-index: 20;
            position: absolute;
            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ffb7c5;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            touch-action: manipulation;
            user-select: none;
        }

        .wish-card .close-btn:hover {
            background: rgba(255, 182, 193, 0.4);
            color: #fff;
        }

        .wish-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 16px;
            display: block;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .wish-card h3 {
            font-family: 'Dancing Script', cursive;
            font-size: 28px;
            color: #ffd700;
            margin-bottom: 12px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .wish-card p {
            font-size: 16px;
            line-height: 1.6;
            color: #f0e6ff;
            font-style: italic;
            margin-bottom: 15px;
        }

        .wish-card .tag {
            font-size: 12px;
            color: #ff9ebb;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .click-hint {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            color: rgba(255, 235, 205, 0.85);
            font-size: 13px;
            letter-spacing: 1px;
            pointer-events: none;
            /* QUAN TRỌNG: Tránh cản trở chạm xoay camera */
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
            animation: pulseHint 2s infinite alternate;
            text-align: center;
            width: 90%;
        }

        @keyframes pulseHint {
            0% {
                opacity: 0.4;
            }

            100% {
                opacity: 0.95;
            }
        }
    </style>
</head>

<body>

        <!-- Three.js & OrbitControls -->
    <script src="./assets/three.min.js"></script>
    <script src="./assets/OrbitControls.js"></script>
    <script src="./assets/script.js"></script>
</body>

</html>
