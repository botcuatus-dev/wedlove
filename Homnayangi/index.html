        function getFoods() { const loc = document.getElementById("loc").value, bud = document.getElementById("bud").value, ml = document.getElementById("meal").value; const buds = bud === "all" ? ["cheap", "rich"] : [bud], meals = ml === "all" ? ["morning", "noon", "evening"] : [ml]; let base = []; buds.forEach(b => meals.forEach(m => { if (DB[loc]?.[b]?.[m]) base.push(...DB[loc][b][m]) })); const custom = JSON.parse(localStorage.getItem("customFoods") || "[]").filter(c => c.city === loc && (bud === "all" || c.budget === bud) && (ml === "all" || c.meal === ml || c.meal === "all")).map(c => c.name); return [...new Set([...base, ...custom])].slice(0, 12) }

        function initWheel() {
            currentFoods = getFoods();
            const c = document.getElementById('wheel'), ctx = c.getContext('2d'), N = currentFoods.length;
            if (N === 0) return;
            const sa = (2 * Math.PI) / N;

            ctx.clearRect(0, 0, 300, 300); ctx.save(); ctx.translate(150, 150);

            // Vẽ từ góc -90 độ (vị trí 12h)
            const startOffset = -Math.PI / 2;

            for (let i = 0; i < N; i++) {
                const angle = startOffset + i * sa;
                ctx.beginPath(); ctx.fillStyle = COLORS[i % COLORS.length];
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, 148, angle, angle + sa);
                ctx.closePath(); ctx.fill();

                // Vẽ đường ngăn cách
                ctx.save(); ctx.rotate(angle); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(148, 0);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.stroke(); ctx.restore();

                // Vẽ chữ
                ctx.save(); ctx.rotate(angle + sa / 2);
                ctx.textAlign = 'right'; ctx.fillStyle = '#fff';
                ctx.font = "bold 12px 'Be Vietnam Pro'";
                ctx.fillText(currentFoods[i].substring(0, 12), 135, 5);
                ctx.restore();
            }

            // Tâm vòng quay
            ctx.beginPath(); ctx.arc(0, 0, 15, 0, 2 * Math.PI); ctx.fillStyle = '#fff'; ctx.fill();
            ctx.restore();
        }

        function spinWheel() {
            if (!currentFoods.length) return;
            const btn = document.getElementById('spin-btn');
            btn.disabled = true; btn.textContent = 'ĐANG QUAY...';

            const N = currentFoods.length;
            const ri = Math.floor(Math.random() * N); // Chọn ngẫu nhiên chỉ số món ăn
            const sliceDeg = 360 / N;
            const extraSpins = 360 * 8; // Quay 8 vòng để tạo hiệu ứng

            // Tính toán góc dừng:
            // Chúng ta muốn ô thứ 'ri' dừng ở đỉnh (vị trí 0 độ của pointer)
            // Vì ta vẽ từ 12h, nên ô 'ri' cần quay một góc ngược lại chỉ số của nó.
            const stopDeg = 360 - (ri * sliceDeg + sliceDeg / 2);

            // Cập nhật tổng góc quay (cộng dồn để vòng quay không bị giật lùi)
            currentDeg += extraSpins + (stopDeg - (currentDeg % 360) + 360) % 360;

            const cv = document.getElementById('wheel');
            cv.style.transition = 'transform 4s cubic-bezier(0.15, 0, 0.15, 1)';
            cv.style.transform = `rotate(${currentDeg}deg)`;

            pendingFood = currentFoods[ri]; // Lưu món ăn chính xác vào biến chờ

            setTimeout(() => {
                // Play sound nếu có
                if (window.playWin) playWin();

                // Hiển thị Modal với đúng món đã chọn (pendingFood)
                showModal(pendingFood, {
                    city: document.getElementById('loc').value,
                    budget: document.getElementById('bud').value
                });

                btn.disabled = false; btn.textContent = 'QUAY TIẾP!';
                updateWheelStats(); // Cập nhật thống kê đồng bộ
            }, 4200);
        }
        
        // Hàm này sẽ tính toán mọi con số từ mảng foodHistory duy nhất
        function updateWheelStats() {
            const hist = JSON.parse(localStorage.getItem('foodHistory') || '[]');
            const todayStr = new Date().toLocaleDateString('vi-VN');

            // 1. Cập nhật Tổng lần quay
            document.getElementById('sw-total').textContent = hist.length;

            // 2. Cập nhật số lần quay Hôm nay
            const todayCount = hist.filter(h => h.date === todayStr).length;
            document.getElementById('sw-today').textContent = todayCount;

            // 3. Cập nhật Món hay ăn nhất
            const favEl = document.getElementById('sw-fav');
            if (hist.length === 0) {
                favEl.textContent = '—';
            } else {
                const counts = {};
                hist.forEach(h => counts[h.food] = (counts[h.food] || 0) + 1);
                const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
                favEl.textContent = top.length > 10 ? top.slice(0, 8) + '..' : top;
            }
        }

        /* ===== HISTORY ===== */
        function saveHistory(food, meta) {
            const hist = JSON.parse(localStorage.getItem('foodHistory') || '[]');
            hist.unshift({ food, meta, date: new Date().toLocaleDateString('vi-VN'), ts: Date.now() });
            if (hist.length > 100) hist.pop();
            localStorage.setItem('foodHistory', JSON.stringify(hist));
        }
        function clearHistory() {
            if (confirm('Bạn có chắc muốn xóa toàn bộ lịch sử không?')) {
                // 1. Xóa sạch trong LocalStorage
                localStorage.removeItem('foodHistory');

                // 2. Nếu bạn có dùng biến toàn cầu để lưu lịch sử, hãy reset nó
                // Ví dụ nếu trong code có: let history = ...
                if (typeof history !== 'undefined') history = [];

        function calcStreak(hist) {
            if (!hist.length) return 0; const days = [...new Set(hist.map(h => h.date))]; if (days.length <= 1) return days.length;
            let s = 1; for (let i = 0; i < days.length - 1; i++) { const d1 = new Date(hist.find(h => h.date === days[i]).ts), d2 = new Date(hist.find(h => h.date === days[i + 1]).ts); if ((d1 - d2) < 2 * 24 * 60 * 60 * 1000) s++; else break; } return s;
        }
        function updateHistoryPane() {
            const hist = JSON.parse(localStorage.getItem('foodHistory') || '[]');
            document.getElementById('h-total').textContent = hist.length;
            document.getElementById('h-unique').textContent = new Set(hist.map(h => h.food)).size;
            const streak = calcStreak(hist); document.getElementById('h-streak').textContent = streak;
            const sa = document.getElementById('streak-area');
            sa.innerHTML = streak >= 3 ? `<div class="streak-banner"><div class="streak-num">🔥${streak}</div><div><div class="streak-title">Streak ${streak} ngày!</div><div class="streak-sub">Đang duy trì thói quen ăn đa dạng!</div></div></div>` : '';
            const freq = {}; hist.forEach(h => { freq[h.food] = (freq[h.food] || 0) + 1; });
            const top = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const fc = document.getElementById('freq-chart');
            fc.innerHTML = top.length ? top.map(([f, n]) => `<div class="freq-row"><div class="freq-name" title="${f}">${f}</div><div class="freq-bar-wrap"><div class="freq-bar" style="width:${Math.round(n / top[0][1] * 100)}%"></div></div><div class="freq-count">${n}</div></div>`).join('') : '<div class="empty"><div class="empty-icon">📊</div>Chưa có dữ liệu</div>';
            const hl = document.getElementById('history-list');
            hl.innerHTML = hist.length ? hist.slice(0, 15).map(h => `<div class="history-item"><div class="history-icon">${getFoodEmoji(h.food)}</div><div class="history-info"><div class="history-name">${h.food}</div><div class="history-sub">${h.meta?.loc || ''}${h.meta?.meal ? ' · ' + h.meta.meal : ''}</div></div><div class="history-badge">${h.date}</div></div>`).join('') : '<div class="empty"><div class="empty-icon">🍽️</div>Chưa có món nào được chốt</div>';
        }

        /* ===== SUGGEST ===== */
        let sgMeal = 'all';

            const mc = document.getElementById('mood-chips'), tc = document.getElementById('taste-chips'), tmc = document.getElementById('time-chips');
            MOOD_DATA.forEach(m => { const b = document.createElement('button'); b.className = 'chip mood-chip'; b.textContent = m.label; b.onclick = () => { b.classList.toggle('active'); activeMoods.has(m.label) ? activeMoods.delete(m.label) : activeMoods.add(m.label); }; mc.appendChild(b); });
            TASTE_DATA.forEach(t => { const b = document.createElement('button'); b.className = 'chip taste-chip'; b.textContent = t.label; b.onclick = () => { b.classList.toggle('active'); activeTastes.has(t.label) ? activeTastes.delete(t.label) : activeTastes.add(t.label); }; tc.appendChild(b); });
            TIMES.forEach(t => { const b = document.createElement('button'); b.className = 'chip time-chip'; b.textContent = t.label; b.onclick = () => { document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('active')); b.classList.add('active'); activeTime = t; }; tmc.appendChild(b); });
        }
        function suggest() {
            const loc = document.getElementById('loc').value;
            const buds = ['cheap', 'rich'], meals = sgMeal === 'all' ? ['morning', 'noon', 'evening'] : [sgMeal];
            let pool = [];
            buds.forEach(b => meals.forEach(m => { if (DB[loc]?.[b]?.[m]) pool.push(...DB[loc][b][m]); }));
            /* filter by mood keywords */
            if (activeMoods.size) {
                const moodKw = []; activeMoods.forEach(ml => { const md = MOOD_DATA.find(m => m.label === ml); if (md) moodKw.push(...md.foods); });
                const filtered = pool.filter(f => moodKw.some(k => f.includes(k)));
                if (filtered.length) pool = filtered;
            }
            /* filter by taste */
            if (activeTastes.size) {
                const tasteKw = []; activeTastes.forEach(tl => { const td = TASTE_DATA.find(t => t.label === tl); if (td) tasteKw.push(...td.kw); });
                const filtered = pool.filter(f => tasteKw.some(k => f.toLowerCase().includes(k.toLowerCase())));
                if (filtered.length) pool = filtered;
            }
            const pick = [...new Set(pool)][Math.floor(Math.random() * pool.length)] || pool[0] || 'Phở bò';
            suggestFood = pick;
            const tags = [];
            activeMoods.forEach(m => tags.push(m.split(' ').slice(1).join(' ')));
            activeTastes.forEach(t => tags.push(t.split(' ')[0]));
            if (activeTime) tags.push(activeTime.label.split(' ').slice(1).join(' '));
            const desc = FOOD_DESC[Object.keys(FOOD_DESC).find(k => pick.includes(k)) || ''] || 'Món ngon được gợi ý cho bạn hôm nay';
            const hero = document.getElementById('suggest-hero');
            hero.innerHTML = `
    <span class="sg-emoji-big">${getFoodEmoji(pick)}</span>
    <div class="sg-food-name">${pick}</div>
    <div class="sg-food-desc">${desc}</div>
    ${tags.length ? `<div class="sg-tags">${tags.map(t => `<span class="sg-tag">${t}</span>`).join('')}</div>` : ''}
    <div class="sg-actions">
      <button class="sg-btn" onclick="suggest()">🎲 Đổi món</button>
      <button class="sg-btn primary" onclick="acceptSuggest()">✓ Chốt!</button>
    </div>`;
        }

        /* ===== TIMER ===== */

        function fmt(s) { return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
        function startTimer() {
            if (!timerSeconds) return; timerRunning = true;
            document.getElementById('timer-start-btn').disabled = true;
            document.getElementById('timer-pause-btn').disabled = false;

                timerSeconds--;
                document.getElementById('timer-display').textContent = fmt(timerSeconds);

        function copyNote() { const n = document.getElementById('order-note').value; if (!n) { toast('⚠️ Ghi chú trống!'); return; } navigator.clipboard.writeText(n).then(() => toast('📋 Đã copy ghi chú!')); }

        /* ===== WEATHER ===== */
        function getWeather() {
            if (!navigator.geolocation) { setWeatherFallback(); return; }
            navigator.geolocation.getCurrentPosition(pos => {
                const { latitude: lat, longitude: lon } = pos.coords;
                fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`)
                    .then(r => r.json()).then(d => {
                        const w = d.current_weather, temp = Math.round(w.temperature), code = w.weathercode;
                        let emoji = '☀️', desc = `Nắng đẹp, ${temp}°C`, suggest = 'Ăn gì cũng ngon hôm nay!';
                        if (code >= 80) { emoji = '⛈️'; desc = `Mưa to, ${temp}°C`; suggest = 'Trời mưa to → Lẩu, bún bò, cháo nóng!'; }
                        else if (code >= 61) { emoji = '🌧️'; desc = `Có mưa, ${temp}°C`; suggest = 'Thời tiết mưa → Cháo, súp, đồ ăn nóng!'; }
                        else if (code >= 1) { emoji = '⛅'; desc = `Có mây, ${temp}°C`; suggest = 'Thời tiết mát → Ăn gì cũng được!'; }
                        if (temp >= 35) { emoji = '🥵'; desc = `Nóng ${temp}°C`; suggest = 'Trời nóng → Cháo trắng, đồ mát, tránh dầu mỡ!'; }
                        else if (temp <= 20) { emoji = '🥶'; desc = `Lạnh ${temp}°C`; suggest = 'Trời lạnh → Lẩu, cháo, bún bò nóng hổi!'; }
                        document.getElementById('w-emoji').textContent = emoji;
                        document.getElementById('w-loc').textContent = 'Vị trí của bạn';
                        document.getElementById('w-desc').textContent = desc;
                        document.getElementById('w-suggest').textContent = '💡 ' + suggest;
                    }).catch(setWeatherFallback);
            }, setWeatherFallback);
