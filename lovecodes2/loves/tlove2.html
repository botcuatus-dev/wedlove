        //CSS
(function(d){
    if(!d.__cssInjected){
        d.__cssInjected = true;
        const css = `*{margin:0;padding:0;box-sizing:border-box;font-family:"Mali",cursive;}body{overflow:hidden;background:radial-gradient(circle at center,#0f0c29 0%,#06051f 60%,#000000 100%);height:100vh;}canvas{position:absolute;top:0;left:0;z-index:1;}.message{position:absolute;top:5%;left:50%;transform:translateX(-50%);z-index:2;text-align:center;color:#fff;font-size:clamp(16px,3vw,24px);font-weight:600;text-shadow:0 0 20px rgba(255,255,255,0.8);opacity:0;animation:fadeInMessage 1s ease-in-out 1s forwards;}.subtitle{font-size:clamp(12px,2vw,16px);margin-top:10px;color:#bbb;font-style:italic;}@keyframes fadeInMessage{0%{opacity:0;transform:translateX(-50%) translateY(20px);}100%{opacity:1;transform:translateX(-50%) translateY(0);}}`;

        //HTML
(function f(){const s=document.getElementById('sandbox')||document.body;s?s.append(document.createRange().createContextualFragment(`<canvas id="canvas"></canvas><canvas id="three-canvas" style="position:absolute; top:0; left:0; z-index:0;"></canvas><div class="message"><div></div><div class="subtitle"></div></div><div id="music-toggle" style=" position: fixed; top: 10px; right: 10px; font-size: 20px; color: white; cursor: pointer; z-index: 1000;"><i id="music-icon" class="fa-solid fa-volume-high"></i></div><audio id="bg-music" loop></audio>`)):setTimeout(f,4)})();

        // --- Canvas setup ---
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        // --- Global variables ---
        const heartStars = [];
        const backgroundStars = [];
        const meteors = [];
        const fallingTexts = [];

        // --- Default messages ---
        const messages = [
            "Em là vũ trụ trong anh",
            "Tim anh chỉ có em",
            "Anh yêu em rất nhiều",
        ];

        // --- DOM elements ---
        const messageDiv = document.querySelector(".message");
        const mainText = messageDiv.children[0];
        const subText = messageDiv.children[1];

        mainText.innerHTML = `I love you in every universe`;
        subText.innerHTML = `Dù ở vũ trụ nào, anh vẫn yêu em`;

        // --- URL params ---
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function decodeBase64(str) {
            try {
                const binary = atob(str);
                const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
                return new TextDecoder().decode(bytes);
            } catch {
                return null;
            }
        }

        // --- Music Elements ---
        const musicElement = document.getElementById("bg-music");
        const toggleBtn = document.getElementById("music-toggle");
        const musicIcon = document.getElementById("music-icon");

        let isPlaying = false;

        // --- Music Controls ---
        function checkMusicSource() {
            const srcAttr = musicElement.getAttribute("src");
            if (!srcAttr || srcAttr.trim() === "") {
                toggleBtn.style.display = "none";
            } else {
                toggleBtn.style.display = "block";
            }
        }

        function updateIcon() {
            if (isPlaying) {
                musicIcon.classList.remove("fa-volume-xmark");
                musicIcon.classList.add("fa-volume-high");
            } else {
                musicIcon.classList.remove("fa-volume-high");
                musicIcon.classList.add("fa-volume-xmark");
            }
        }

        toggleBtn.addEventListener("click", () => {
            if (isPlaying) {
                musicElement.pause();
            } else {
                musicElement.play().catch(() => { });
            }
        });

        musicElement.addEventListener("play", () => {
            isPlaying = true;
            updateIcon();
        });

        musicElement.addEventListener("pause", () => {
            isPlaying = false;
            updateIcon();
        });

        updateIcon();

        // --- Load data from URL ---
        const compressedData = getQueryParam("d");
        if (compressedData) {
            try {
                // 1. Giải nén LZ-String
                const rawPayload = LZString.decompressFromEncodedURIComponent(compressedData);

                if (rawPayload) {
                    // 2. Tách chuỗi theo dấu |
                    const parts = rawPayload.split('|');

                    const decompressText = (text) => {
                        if (text && window.Keypans && typeof window.Keypans.decompressWithDictionary === "function") {
                            return window.Keypans.decompressWithDictionary(text);
                        }
                        return text || "";
                    };

                    const mainTextVal = decompressText(parts[0]);
                    const subTextVal = decompressText(parts[1]);
                    const musicVal = parts[2];
                    const messagesList = parts.slice(3).map(msg => decompressText(msg));

                    // --- Render UI ---
                    if (mainTextVal && subTextVal) {
                        mainText.innerHTML = mainTextVal;
                        subText.innerHTML = subTextVal;
                    }

                    if (messagesList.length > 0) {
                        messages.length = 0;
                        messages.push(...messagesList);
                    }

                    // --- Music ---
                    if (musicVal) {
                        const musicPath = musicVal.startsWith("http") ? musicVal : `./${musicVal}`;
                        musicElement.setAttribute("src", musicPath);
                        musicElement.load();
                        checkMusicSource();

                        const playMusicOnce = () => {
                            musicElement.play().catch(() => { });
                            window.removeEventListener("click", playMusicOnce);
                        };
                        window.addEventListener("click", playMusicOnce);
                    } else {
                        musicElement.removeAttribute("src");
                        checkMusicSource();
                    }
                }
            } catch (err) {
                console.error("Lỗi khi giải nén:", err);
                musicElement.removeAttribute("src");
                checkMusicSource();
            }
        }

        // --- Heart shape ---
        function heartShape(t, scale = 1) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(
                13 * Math.cos(t) -
                5 * Math.cos(2 * t) -
                2 * Math.cos(3 * t) -
                Math.cos(4 * t)
            );
            return { x: x * scale, y: y * scale };
        }

        // --- Variables ---
        let heartScale = Math.min(width, height) * 0.015;
        let heartBeat = 0;
        let mouseX = width / 2;
        let mouseY = height / 2;

        // --- Create effects ---
        function createHeartStars(count = 600) {
            const centerX = width / 2;
            const centerY = height / 2 + 20;
            heartStars.length = 0;

            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2;
                const heart = heartShape(t, heartScale);
                const offsetX = (Math.random() - 0.5) * 15;
                const offsetY = (Math.random() - 0.5) * 15;

                const targetX = centerX + heart.x + offsetX;
                const targetY = centerY + heart.y + offsetY;

                heartStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    targetX,
                    targetY,
                    originalX: targetX,
                    originalY: targetY,
                    size: Math.random() * 2 + 1,
                    twinkle: Math.random() * Math.PI * 2,
                    twinkleSpeed: Math.random() * 0.02 + 0.01,
                    brightness: Math.random() * 0.5 + 0.5,
                    hue: Math.random() * 60 + 300,
                    mode: "flying",
                });
            }
        }

        function createBackgroundStars(count = 100) {
            backgroundStars.length = 0;
            for (let i = 0; i < count; i++) {
                backgroundStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1 + 0.3,
                    twinkle: Math.random() * Math.PI * 2,
                    twinkleSpeed: Math.random() * 0.01 + 0.005,
                    brightness: Math.random() * 0.3 + 0.2,
                });
            }
        }

        // --- Falling text ---
        const fontCache = new Map();
        function measureText(text, fontSize) {
            const key = `${text}_${fontSize}`;
            if (!fontCache.has(key)) {
                ctx.font = `${fontSize}px Mali`;
                fontCache.set(key, ctx.measureText(text).width);
            }
            return fontCache.get(key);
        }

        function createFallingText() {
            const count = 2;
            for (let i = 0; i < count; i++) {
                const text = messages[Math.floor(Math.random() * messages.length)];
                const fontSize = Math.random() * 8 + 14;
                ctx.font = `${fontSize}px Mali`;
                const textWidth = ctx.measureText(text).width;

                const zone = Math.random() < 0.5 ? 0 : width / 2;
                const x = zone + Math.random() * (width / 2 - textWidth - 20);

                fallingTexts.push({
                    text,
                    x,
                    y: -20,
                    speed: Math.random() * 1 + 1,
                    alpha: 1,
                    fontSize,
                    hue: Math.random() * 360,
                });
            }
        }

        // --- Resize ---
        let resizeTimeout;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                heartScale = Math.min(width, height) * 0.015;
                createHeartStars();
                createBackgroundStars();
                fontCache.clear();
            }, 200);
        });

        // --- Mouse move ---
        let mouseMoveTimeout;
        canvas.addEventListener("mousemove", (e) => {
            if (!mouseMoveTimeout) {
                mouseMoveTimeout = setTimeout(() => {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                    mouseMoveTimeout = null;
                }, 16);
            }
        });

        // --- Click heart spread ---
        canvas.addEventListener("click", (e) => {
            const centerX = width / 2;
            const centerY = height / 2 + 20;
            for (let i = 0; i < 3; i++) {
                const t = Math.random() * Math.PI * 2;
                const h = heartShape(t, heartScale);
                heartStars.push({
                    x: e.clientX,
                    y: e.clientY,
                    targetX: centerX + h.x,
                    targetY: centerY + h.y,
                    size: Math.random() * 2 + 1,
                    twinkle: Math.random() * Math.PI * 2,
                    twinkleSpeed: Math.random() * 0.03 + 0.02,
                    brightness: Math.random() * 0.8 + 0.6,
                    hue: Math.random() * 60 + 300,
                    mode: "flying",
                });
            }
        });

        // --- Intervals ---
        setInterval(createFallingText, 2000);

        // --- Animation loop ---
        let lastTime = performance.now();
        const targetFPS = 60;
        const frameTime = 1000 / targetFPS;

        function animate(currentTime) {
            requestAnimationFrame(animate);

            const deltaTime = currentTime - lastTime;
            if (deltaTime < frameTime) return;
            lastTime = currentTime - (deltaTime % frameTime);

            heartBeat += 0.08;
            ctx.clearRect(0, 0, width, height);

            // --- Background stars ---
            ctx.fillStyle = "#fff";
            backgroundStars.forEach((star) => {
                star.twinkle += star.twinkleSpeed;
                const opacity = star.brightness * (0.5 + 0.5 * Math.sin(star.twinkle));
                ctx.globalAlpha = opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // --- Meteors ---
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                const dx = Math.cos(m.angle) * m.length;
                const dy = Math.sin(m.angle) * m.length;

                ctx.globalAlpha = m.alpha;
                ctx.strokeStyle = "rgba(255,255,255,0.8)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x - dx, m.y - dy);
                ctx.stroke();

                m.x += Math.cos(m.angle) * m.speed;
                m.y += Math.sin(m.angle) * m.speed;
                m.alpha -= 0.005;
                if (m.alpha <= 0 || m.x > width || m.y > height) meteors.splice(i, 1);
            }
            ctx.globalAlpha = 1;

            // --- Falling texts ---
            for (let i = fallingTexts.length - 1; i >= 0; i--) {
                const t = fallingTexts[i];
                ctx.font = `${t.fontSize}px Mali`;
                ctx.fillStyle = `hsla(${t.hue}, 100%, 85%, ${t.alpha})`;
                ctx.shadowBlur = 2;
                ctx.shadowColor = `hsla(${t.hue}, 100%, 70%, ${t.alpha * 0.5})`;
                ctx.fillText(t.text, t.x, t.y);
                t.y += t.speed;
                t.alpha -= 0.0015;
                if (t.y > height + 50 || t.alpha <= 0) fallingTexts.splice(i, 1);
            }
            ctx.shadowBlur = 0;

            // --- Heart stars ---
            const centerX = width / 2;
            const centerY = height / 2 + 20;
            const beatScale = 1 + Math.sin(heartBeat) * 0.05;

            heartStars.forEach((star) => {
                star.twinkle += star.twinkleSpeed;
                if (star.mode === "flying") {
                    const dx = star.targetX - star.x;
                    const dy = star.targetY - star.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 1) {
                        star.x += dx * 0.05;
                        star.y += dy * 0.05;
                    } else star.mode = "heart";
                } else {
                    const deltaX = star.targetX - centerX;
                    const deltaY = star.targetY - centerY;
                    star.x = centerX + deltaX * beatScale;
                    star.y = centerY + deltaY * beatScale;
                    const distToMouse = Math.hypot(mouseX - star.x, mouseY - star.y);
                    if (distToMouse < 80) {
                        const angle = Math.atan2(star.y - mouseY, star.x - mouseX);
                        star.x += Math.cos(angle) * 1.5;
                        star.y += Math.sin(angle) * 1.5;
                    }
                }
                const opacity = star.brightness * (0.4 + 0.6 * Math.sin(star.twinkle));
                ctx.globalAlpha = opacity;
                ctx.fillStyle = `hsl(${star.hue}, 70%, 80%)`;
                ctx.shadowBlur = 6;
                ctx.shadowColor = `hsl(${star.hue}, 70%, 60%)`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        // --- Init ---
        createHeartStars();
        createBackgroundStars();
        animate(performance.now());
