:-200px;transform:translateY(-50%);width:100px;height:100px;opacity:0;}#slide-image.show{animation:slideIn 0.8s forwards;}@keyframes slideIn{0%{right:-200px;opacity:0;}100%{right:50%;transform:translate(50%,-50%);opacity:1;}}.flying-heart{position:absolute;font-size:24px;color:var(--blushs-pink);pointer-events:none;animation:heartFlyUp 2s forwards;will-change:transform,opacity;}@keyframes heartFlyUp{0%{transform:translateY(0) scale(1) rotate(0deg);opacity:1;}100%{transform:translateY(-250px) scale(2) rotate(-10deg);opacity:0;}}@media (max-width:768px){#frase-container{top:35%;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:16px;border-width:2px;font-size:calc(18px * var(--scale-factor));line-height:1.5;box-shadow:0 3px 10px rgba(135,184,224,0.35);}#frase-container.show{animation:flyUpMobile 0.4s ease-out forwards;}@keyframes flyUpMobile{0%{transform:translate(-50%,60px) scale(0.5);opacity:0;}100%{transform:translate(-50%,0) scale(1);opacity:1;}}}`;

(function f(){const s=document.getElementById('sandbox')||document.body;s?s.append(document.createRange().createContextualFragment(`<svg style="position: absolute; width: 0; height: 0;"><defs><filter id="sketchy"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" /><feDisplacementMap in="SourceGraphic" in2="noise" scale="4" /></filter></defs></svg><div id="frase-container"></div><div class="cinnamoroll-container"><div class="sparkle s1"></div><div class="sparkle s2"></div><div class="sparkle s3"></div><div class="sparkle s4"></div><div class="ear left-ear"></div><div class="ear right-ear"></div><div class="head"><div class="face-details"><div class="eye left-eye"></div><div class="eye right-eye"></div><div class="cheek left-cheek"></div><div class="cheek right-cheek"></div><div class="mouth"><svg width="20" height="10" viewBox="0 0 20 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 5C2 5 5 8 10 5C15 2 18 5 18 5" stroke="#E7A8B9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg></div></div><div class="paw left-paw"></div><div class="paw right-paw"></div></div></div>`)):setTimeout(f,4)})();

        // 1. Khai báo DOM & Âm thanh
        const cinnamorollContainer = document.querySelector('.cinnamoroll-container');
        const cinnamoroll = document.querySelector('.head');
        const fraseContainer = document.getElementById('frase-container');
        const popSound = new Audio('./a/yes.mp3');

        let bgMusic = null;
        let musicStarted = false;

        // 2. Hàm đọc và giải mã / giải nén dữ liệu từ URL (LZ-String + Keypans)
        function loadData() {
            const params = new URLSearchParams(window.location.search);
            const compressedData = params.get("d") || params.get("id");

            if (!compressedData) {
                return {
                    frases: [
                        "Em là lý do khiến thế giới của anh ngọt ngào hơn.",
                        "Nụ cười của em thắp sáng cả những ngày xám xịt nhất.",
                        "Nghĩ về em giống như một cái ôm dành cho trái tim anh"
                    ],
                    musicPath: "./a/1.mp3"
                };
            }

            try {
                let decompressed = LZString.decompressFromEncodedURIComponent(compressedData);

                if (decompressed) {
                    if (window.Keypans && typeof window.Keypans.decompressWithDictionary === "function") {
                        decompressed = window.Keypans.decompressWithDictionary(decompressed);
                    }

                    const parts = decompressed.split('|');
                    let musicId = parts[0];
                    const lines = parts.slice(1);

                    // Sửa logic ghép đường dẫn nhạc chuẩn xác
                    let finalMusicPath = "";
                    if (musicId) {
                        // Nếu musicId chứa sẵn extension .mp3 hoặc chưa
                        if (!musicId.endsWith('.mp3')) {
                            musicId += '.mp3';
                        }
                        finalMusicPath = musicId.startsWith('a/') ? `./${musicId}` : `./a/${musicId}`;
                    }

                    return {
                        frases: lines.length > 0 ? lines : ["Lời chúc trống"],
                        musicPath: finalMusicPath
                    };
                } else {
                    throw new Error("Không thể giải nén chuỗi LZ-String");
                }

            } catch (e) {
                console.error("Decode lỗi:", e);
                return {
                    frases: ["Link bị lỗi dữ liệu"],
                    musicPath: "./a/1.mp3"
                };
            }
        }

        // 3. Khởi tạo dữ liệu
        const data = loadData();
        const frases = data.frases;

        // Tải trước nhạc nền
        bgMusic = new Audio(data.musicPath);
        bgMusic.loop = true;
        bgMusic.preload = "auto";

        let index = 0;
        let timeoutId;

        // 4. Các hàm hiệu ứng phụ (Trái tim, Bọt khí)
        function createFlyingHeartFromBottom() {
            const heart = document.createElement('span');
            heart.className = 'flying-heart';
            heart.textContent = '❤';

            const x = Math.random() * (window.innerWidth - 30);
            const y = window.innerHeight - 30;

            heart.style.left = x + 'px';
            heart.style.top = y + 'px';

            const duration = 1.5 + Math.random();
            const scale = 0.8 + Math.random() * 0.4;
            heart.style.animationDuration = duration + 's';
            heart.style.transform = `scale(${scale})`;

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), duration * 1000);
        }

        function createBubble(x, y) {
            const bubble = document.createElement('span');
            bubble.className = 'bubble';
            bubble.style.left = x + 'px';
            bubble.style.top = y + 'px';
            document.body.appendChild(bubble);

            setTimeout(() => {
                bubble.remove();
            }, 1000);
        }

        // 5. Sự kiện tương tác chính
        if (cinnamorollContainer) {
            // Dùng 'pointerdown' hoặc 'pointerup' để đảm bảo ăn sự kiện chạm trên Mobile
            cinnamorollContainer.addEventListener('pointerup', (e) => {
                // --- Nhắm / Mở mắt Cinnamoroll ---
                cinnamorollContainer.classList.add('active');
                setTimeout(() => {
                    cinnamorollContainer.classList.remove('active');
                }, 800);

                // --- Tạo hiệu ứng bong bóng tại điểm chạm ---
                createBubble(e.clientX, e.clientY);

                // --- Phát nhạc nền (Lần tương tác đầu tiên) ---
                if (!musicStarted && bgMusic) {
                    bgMusic.play().then(() => {
                        musicStarted = true;
                    }).catch(err => {
                        console.log("Trình duyệt chặn autoplay hoặc tệp nhạc không tồn tại:", err);
                    });
                }

                // --- Âm thanh Pop ---
                popSound.currentTime = 0;
                popSound.play().catch(() => { });

                // --- Bật hiệu ứng chữ Lời Chúc (Chạy tuần tự) ---
                clearTimeout(timeoutId);
                fraseContainer.classList.remove('show');

                setTimeout(() => {
                    fraseContainer.textContent = frases[index];
                    index = (index + 1) % frases.length;
                    fraseContainer.classList.add('show');

                    timeoutId = setTimeout(() => {
                        fraseContainer.classList.remove('show');
                    }, 4000);
                }, 20);

                // --- Bắn tim từ dưới màn hình lên ---
                const heartCount = 10 + Math.floor(Math.random() * 10);
                for (let i = 0; i < heartCount; i++) {
                    setTimeout(() => createFlyingHeartFromBottom(), i * 80);
                }

                // --- Thêm ảnh bay (Slide-in) ---
                const img = document.createElement('img');
                img.className = 'flying-img';
                document.body.appendChild(img);

                requestAnimationFrame(() => {
                    img.classList.add('show');
                });

                setTimeout(() => {
                    img.remove();
                }, 2000);
            });
        }

        // window.addEventListener("load", () => {
        //     const ant = atob("cGFuYmFwLmdpdGh1Yi5pbw==");
        //     if (location.hostname !== ant) { document.body.innerHTML = ""; }
        // });

        //=========Điều kiện========
        // if (!document.querySelector('meta[name="author"][content="Devpan"]'))
        //     document.body.innerHTML = "";

        //=========Chặn f12 và chuột phải========

        //         e.key === 'F12' ||

        //         (e.ctrlKey && e.key === 'U')
        //     ) {
        //         e.preventDefault();
        //         location = atob("aHR0cHM6Ly9kZXZwYW4udmVyY2VsLmFwcA==");
        //     }
        // });
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        //=========Chặn bôi đen========
        document.addEventListener('selectstart', e => e.preventDefault());
