(function(d){

(function f(){const s=document.getElementById('sandbox')||document.body;s?s.append(document.createRange().createContextualFragment(`<img id="main-img" src="./a/i/1.gif" alt="Hình ảnh" /><h2 id="main-text">Em có yêu anh không?</h2><div class="button-wrapper" id="button-wrapper"><button id="yesBtn">Dạ</button><button id="noBtn">Hông</button></div><audio id="love-audio"></audio><audio id="yesSound" src="./a/yes.mp3"></audio><audio id="noSound" src="./a/no.mp3"></audio>`)):setTimeout(f,4)})();

       const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const img = document.getElementById('main-img');
        const text = document.getElementById('main-text');
        const wrapper = document.getElementById('button-wrapper');
        const yesSound = document.getElementById('yesSound');
        const noSound = document.getElementById('noSound');

        // Hàm di chuyển nút "Không" và phát âm thanh
        function moveNoButton() {
            if (noSound) {
                noSound.currentTime = 0;
                noSound.play().catch(() => {});
            }
            
            noBtn.style.position = 'fixed';

            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // Đăng ký sự kiện cho noBtn
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', function (e) {
            e.preventDefault();
            moveNoButton();
        });

        // Hàm giải nén văn bản bằng Keypans nếu thư viện tồn tại
        function decompressText(str) {
            if (!str) return str;
            return typeof Keypans !== "undefined" ? Keypans.decompressWithDictionary(str) : str;
        }

        // Xử lý sự kiện nút "Có" mặc định
        yesBtn.addEventListener('click', () => {
            if (yesSound) {
                yesSound.currentTime = 0;
                yesSound.play().catch(() => {});
            }

            const audio = new Audio("./a/4.mp3");
            audio.loop = true;
            audio.play().catch((err) => console.warn("Không thể phát nhạc:", err));

            wrapper.style.display = 'none';

            // Tạo tim rơi liên tục
            const heartInterval = setInterval(createHeart, 150);

            // Dừng tạo tim sau một khoảng thời gian
            setTimeout(() => {
                clearInterval(heartInterval);
            }, 300000);
        });

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = '❤';

            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.fontSize = (20 + Math.random() * 30) + 'px';

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 3000);
        }

        // Đọc và giải nén dữ liệu URL (LZ-String + Keypans) khi trang tải xong
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const compressedData = params.get('d') || params.get('id');

            if (compressedData) {
                try {
                    // Lớp 1: Giải nén LZ-String từ URL
                    let decompressed = LZString.decompressFromEncodedURIComponent(compressedData);

                    if (decompressed) {
                        // Tách dữ liệu ghép dạng "l|m|n|o|g|h"
                        const parts = decompressed.split('|');

                        // Lớp 2: Giải nén từ điển Keypans cho các chuỗi văn bản
                        const decryptedData = {
                            l: parts[0] || '',
                            m: parts[1] || '',
                            n: decompressText(parts[2]),
                            o: decompressText(parts[3]),
                            g: decompressText(parts[4]),
                            h: decompressText(parts[5])
                        };

                        // Cập nhật giao diện ban đầu
                        if (decryptedData.l) img.src = decryptedData.l;
                        if (decryptedData.n) text.textContent = decryptedData.n;
                        if (decryptedData.g) yesBtn.textContent = decryptedData.g;
                        if (decryptedData.h) noBtn.textContent = decryptedData.h;

                        // Đăng ký hành động khi nhấn "Có" để chuyển ảnh & nội dung mới
                        yesBtn.addEventListener('click', () => {
                            wrapper.style.display = 'none';
                            if (decryptedData.m) img.src = decryptedData.m;
                            if (decryptedData.o) text.textContent = decryptedData.o;
                        });
                    } else {
                        throw new Error("Dữ liệu nén không hợp lệ");
                    }

                } catch (e) {
                    console.error('Không thể giải mã dữ liệu LZ-String:', e);
                    // Dùng mặc định nếu giải mã thất bại
                    img.src = './a/i/1.gif';
                    text.textContent = 'Anh yêu em nhiều lắm';
                }
            } else {
                // Giá trị mặc định khi không có tham số URL
                img.src = './a/i/1.gif';
                text.textContent = 'Anh yêu em nhiều lắm';
            }
        });
