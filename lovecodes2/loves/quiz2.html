t:none;white-space:nowrap;color:#ff6f6f;will-change:transform;text-shadow:0 0 5px #9eb5ff;}@keyframes fall{0%{top:-10vh;}100%{top:100vh;}}@keyframes starBlink{0%,100%{opacity:0;}50%{opacity:1;}}@media (max-width:400px){#text{margin-top:20px;font-size:6vw;}#yes-btn,#no-btn{font-size:5vw;padding:4vw 6vw;}}`;
        if (window.CSSStyleSheet && CSSStyleSheet.prototype.replaceSync && 'adoptedStyleSheets' in d) {
            const s = new CSSStyleSheet();
            s.replaceSync(css);
            d.adoptedStyleSheets = [...d.adoptedStyleSheets, s];
        } else {
            const t = d.createElement('style');
            t.textContent = css;
            d.head.appendChild(t);

})(document);
        //HTML
(function f(){const s=document.getElementById('sandbox')||document.body;s?s.append(document.createRange().createContextualFragment(`<div id="fixed-area"><img id="main-img" src="./a/i/1.gif" alt="Hình ảnh" /><div id="text">Em làm người yêu anh nhé!</div></div><div id="button-container"><button id="yes-btn">Dạ</button><button id="no-btn">Hông</button></div><audio id="love-audio"></audio><audio id="yesSound" src="./a/yes.mp3"></audio><audio id="noSound" src="./a/no.mp3"></audio>`)):setTimeout(f,4)})();

        const textElement = document.getElementById("text");
        const yesBtn = document.getElementById("yes-btn");
        const noBtn = document.getElementById("no-btn");
        const imgElement = document.getElementById("main-img");
        const buttonContainer = document.getElementById("button-container");
        const yesSound = document.getElementById('yesSound');
        const noSound = document.getElementById('noSound');

        function getParam(key) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(key);
        }

        // Hàm giải nén Keypans cho các chuỗi văn bản tiếng Việt
        function decompressText(str) {
            if (!str) return str;
            return typeof Keypans !== "undefined" ? Keypans.decompressWithDictionary(str) : str;
        }

        // Mảng các câu phản hồi mặc định
        const allReplies = [
            ["Thật sao cậu", "Cậu chắc chưa đó?", "Đừng làm vậy với tớ", "Tim tớ đang tan vỡ", "Tớ sắp khóc rồi đó"], // Mảng 0
            ["Thật sao em", "Em chắc chưa đó?", "Đừng làm vậy với anh", "Tim anh đang tan vỡ", "Anh sắp khóc rồi đó"], // Mảng 1 (Nam)
            ["Thật sao anh", "Anh chắc chưa đó?", "Đừng làm vậy với em", "Tim em đang tan vỡ", "Em sắp khóc rồi đó"], // Mảng 2 (Nữ)
        ];

        let n = allReplies[0];

        const noImgs = [
            "./a/i/2.gif",
            "./a/i/3.gif",
            "./a/i/4.gif",
            "./a/i/5.gif",
            "./a/i/6.gif",
        ];

        let fallingWords = ["❤", "Tớ yêu cậu", "Mãi yêu cậu", "Tớ là của cậu"];

        // ==========================================
        // ĐỌC VÀ GIẢI MÃ DỮ LIỆU LZSTRING TỪ URL
        // ==========================================
        const compressedData = getParam("d") || getParam("id"); // Đọc tham số 'd' hoặc 'id'

        if (compressedData && typeof LZString !== "undefined") {
            try {
                const decompressed = LZString.decompressFromEncodedURIComponent(compressedData);
                if (decompressed) {
                    const parts = decompressed.split('|');

                    const textDecrypted = decompressText(parts[0]);
                    const wordsDecrypted = decompressText(parts[1]);
                    const lDecrypted = parts[2] || '';
                    const nTextDecrypted = decompressText(parts[3]);
                    const parsedNIndex = parts[4];

                    if (textDecrypted) textElement.innerText = textDecrypted;
                    if (lDecrypted) yesBtn.innerText = lDecrypted;
                    if (nTextDecrypted) noBtn.innerText = nTextDecrypted;

                    if (wordsDecrypted) {
                        const parsedWords = wordsDecrypted.split(/,|\n/).map(w => w.trim()).filter(Boolean);
                        if (parsedWords.length > 0) fallingWords = parsedWords;
                    }

                    if (parsedNIndex !== undefined && parsedNIndex !== "") {
                        const idx = parseInt(parsedNIndex);
                        if (!isNaN(idx) && idx >= 0 && idx < allReplies.length) {
                            n = allReplies[idx];
                        }
                    }
                }
            } catch (e) {
                console.error("Lỗi giải mã LZString:", e);
            }
        }

        // Kiểm tra nếu có truyền nIndex dạng query param riêng biệt
        const nIndexParam = parseInt(getParam("nIndex"));
        if (!isNaN(nIndexParam) && nIndexParam >= 0 && nIndexParam < allReplies.length) {
            n = allReplies[nIndexParam];
        }

        // ==========================================
        // XỬ LÝ SỰ KIỆN NÚT BẤM (GIAO DIỆN)
        // ==========================================
        let noClickCount = 0;
        let yesFontSize = 16;

        noBtn.addEventListener("click", () => {
            if (noSound) {
                noSound.currentTime = 0;
                noSound.play().catch(() => {});
            }

            if (noClickCount < n.length) {
                imgElement.src = noImgs[noClickCount];
                noBtn.innerText = n[noClickCount];
                noClickCount++;

                yesFontSize += 20;
                yesBtn.style.fontSize = yesFontSize + "px";
                yesBtn.style.padding = (10 + noClickCount * 2) + "px " + (20 + noClickCount * 2) + "px";
            }

            if (noClickCount === n.length) {
                setTimeout(() => (noBtn.style.display = "none"), 100);
            }
        });

        yesBtn.addEventListener("click", () => {
            if (yesSound) {
                yesSound.currentTime = 0;
                yesSound.play().catch(() => {});
            }

            textElement.style.display = "none";
            imgElement.style.display = "none";
            buttonContainer.style.display = "none";

            const audio = new Audio("./a/4.mp3");
            audio.loop = true;
            audio.play().catch((err) => console.warn("Không thể phát nhạc:", err));

            document.body.style.backgroundColor = "#121212";

            // Tạo nền sao đêm
            const starBackground = document.createElement("div");
            starBackground.id = "star-background";
            Object.assign(starBackground.style, {
                position: "fixed",
                top: 0,
                left: 0,
                width: "100vw",
                height: "100vh",
                backgroundColor: "hsla(207, 90%, 4%, 0.95)",
                zIndex: "-1",
                pointerEvents: "none",
                overflow: "hidden",
            });
            document.body.appendChild(starBackground);

            for (let i = 0; i < 80; i++) {
                const star = document.createElement("div");
                star.className = "star";
                const size = Math.random() * 1.2 + 0.4 + "px";
                const left = Math.random() * 100 + "vw";
                const top = Math.random() * 100 + "vh";
                const delay = Math.random() * 3 + "s";
                const duration = Math.random() * 2 + 1 + "s";
                star.style.cssText = `
                    position: absolute;
                    width: ${size};
                    height: ${size};
                    background: white;
                    border-radius: 50%;
                    left: ${left};
                    top: ${top};
                    opacity: 0;
                    animation: starBlink ${duration} ease-in-out infinite;
                    animation-delay: ${delay};
                `;
                starBackground.appendChild(star);
            }

            // Hiệu ứng chữ rơi
            const layers = [
                { fontSize: 32, opacity: 1, duration: 4, positions: [] },
                { fontSize: 24, opacity: 0.8, duration: 5, positions: [] },
                { fontSize: 20, opacity: 0.7, duration: 6, positions: [] },
                { fontSize: 16, opacity: 0.6, duration: 7, positions: [] },
                { fontSize: 12, opacity: 0.5, duration: 8, positions: [] },
            ];

            function isPositionValid(positions, left) {
                return positions.every((pos) => Math.abs(pos - left) > 8);
            }

            setInterval(() => {
                const span = document.createElement("span");
                span.className = "falling-text";
                span.textContent = fallingWords[Math.floor(Math.random() * fallingWords.length)];

                const layerIndex = Math.floor(Math.random() * layers.length);
                const layer = layers[layerIndex];

                let left;
                let attempts = 0;
                do {
                    left = Math.random() * 100;
                    attempts++;
                    if (attempts > 30) break;
                } while (!isPositionValid(layer.positions, left));

                layer.positions.push(left);

                const colors = ["#ff9e9e", "#f06292", "#85e4ff"];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];

                span.style.left = left + "vw";
                span.style.fontSize = layer.fontSize + "px";
                span.style.opacity = layer.opacity;
                span.style.animationDuration = layer.duration + "s";
                span.style.color = randomColor;
                span.style.textShadow = "0 0 5px white";

                document.body.appendChild(span);

                setTimeout(() => {
                    span.remove();
                    const index = layer.positions.indexOf(left);
                    if (index > -1) layer.positions.splice(index, 1);
                }, layer.duration * 1000 + 500);
            }, 100);
        });

        // window.addEventListener("load", () => {
        //     const ant = atob("cGFuYmFwLmdpdGh1Yi5pbw==");
        //     if (location.hostname !== ant) { document.body.innerHTML = ""; }
        // });
        //=========Điều kiện========
        // if (!document.querySelector('meta[name="author"][content="Devpan"]'))
        //     document.body.innerHTML = "";

        //=========Chặn f12 và chuột phải========

        //     if (
        //         e.key === 'F12' ||
        //         (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) ||
        //         (e.ctrlKey && e.key === 'U')
        //     ) {
        //         e.preventDefault();
        //         location = atob("aHR0cHM6Ly9kZXZwYW4udmVyY2VsLmFwcA==");
        //     }
        // });
        // document.addEventListener('contextmenu', function (e) {
        //     e.preventDefault();
        // });

        //=========Chặn bôi đen========
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('contextmenu', e => e.preventDefault());
        // document.addEventListener('keydown', e => {
        //     if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 'a')) {
