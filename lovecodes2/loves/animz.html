        //CSS
(function(d){
    if(!d.__cssInjected){
        d.__cssInjected = true;
        const css = `*{margin:0;padding:0;box-sizing:border-box;}html,body{margin:0;padding:0;box-sizing:border-box;height:100%;width:100%;overflow:hidden;background:black;}#bear{position:absolute;left:10px;bottom:50px;width:110px;z-index:2;transition:transform 0.2s,left 1s ease;cursor:pointer;}#bear:hover{transform:scale(1.2);}#overlayCanvas{position:absolute;top:0;left:0;pointer-events:none;z-index:1;}#portrait-warning{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:black;color:white;font-size:24px;justify-content:center;align-items:center;text-align:center;z-index:9999;padding:20px;flex-direction:column;display:flex;}.rotate-icon{width:80px;font-size:48px;animation:rotateHint 1.2s ease-in-out infinite;transform-origin:center;}@keyframes rotateHint{0%{transform:rotate(0deg);}25%{transform:rotate(20deg);}50%{transform:rotate(0deg);}75%{transform:rotate(-20deg);}100%{transform:rotate(0deg);}}#playMusicBtn:hover{transform:scale(1.1);transition:0.2s;}#playMusicBtn i{color:#cccccc;}`;

        //HTML
(function f(){const s=document.getElementById('sandbox')||document.body;s?s.append(document.createRange().createContextualFragment(`<div id="portrait-warning" style="display: none;"><img class="rotate-icon" src="./a/i/123.png" alt="Rotate icon"> Vui lòng xoay ngang thiết bị để xem nội dung 🎉 </div><img id="bear" src="./a/i/anh321.gif" alt="Bear"><canvas id="overlayCanvas"></canvas><button id="playMusicBtn" style="display: none; position: fixed; top: 20px; right: 20px; font-size: 20px; background: transparent; border: none; cursor: pointer; z-index: 9999;"><i class="fa-solid fa-volume-xmark"></i></button>`)):setTimeout(f,4)})();

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            2000
        );
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        camera.position.z = 500;

        // Set size & pixel ratio
        function setRendererSize() {
            const dpr = window.devicePixelRatio || 1;
            renderer.setSize(window.innerWidth * dpr, window.innerHeight * dpr, false);
            renderer.domElement.style.width = `${window.innerWidth}px`;
            renderer.domElement.style.height = `${window.innerHeight}px`;
        }
        setRendererSize();
        document.body.appendChild(renderer.domElement);

        // === STARFIELD ===
        const starCount = 1000;
        const positions = new Float32Array(starCount * 3);
        for (let i = 0; i < positions.length; i++) {
            positions[i] = (Math.random() - 0.5) * 2000;
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 1,
            transparent: true,
            opacity: 0.8,
        });
        const starField = new THREE.Points(starGeom, starMat);
        scene.add(starField);

        // === SHOOTING STARS ===
        const shootingStars = [];

        function createShootingStar() {
            const geometry = new THREE.SphereGeometry(2, 8, 8);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const star = new THREE.Mesh(geometry, material);

            const fromLeft = Math.random() > 0.5;

            const startX = fromLeft ? -1100 : 1100; // ngoài màn hình
            const endX = fromLeft ? 1100 : -1100; // bay ngang qua
            const y = Math.random() * 600 - 300; // vị trí dọc ngẫu nhiên
            const z = Math.random() * -400 - 400; // chiều sâu (xa hơn camera)

            star.position.set(startX, y, z);

            // Bay ngang với vận tốc ổn định
            const direction = new THREE.Vector3(endX - startX, 0, 0).normalize();
            const velocity = direction.multiplyScalar(10 + Math.random() * 5); // tốc độ ngẫu nhiên

            star.userData = { velocity };

            scene.add(star);
            shootingStars.push(star);
        }

        setInterval(createShootingStar, 1000);

        // === CAMERA ROTATION ===
        let mouseX = 0,
            mouseY = 0;
        document.addEventListener("mousemove", (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        const autoRotateY = 0.0001;
        const autoRotateX = 0.00005;

        // === HEART SHOOTING CANVAS SETUP ===
        const overlayCanvas = document.getElementById("overlayCanvas");
        const ctx = overlayCanvas.getContext("2d");
        const bear = document.getElementById("bear");

        const config = {
            fontSize: 40,
            fontFamily: "Verdana",
            lineHeight: 80,
            bearX: 70,
            shootInterval: 30,
            shootPerTick: 4,
            textLines: ["Chúc mừng sinh nhật", "bạn yêu"],
            heart: "😘",
            music: "",
        };

        // Hàm giải nén văn bản bằng Keypans
        function decompressText(str) {
            if (!str) return str;
            return typeof Keypans !== "undefined" ? Keypans.decompressWithDictionary(str) : str;
        }

        // ==========================================
        // ĐỌC VÀ GIẢI MÃ DỮ LIỆU LZSTRING TỪ URL
        // ==========================================
        const params = new URLSearchParams(location.search);
        const compressedData = params.get("d") || params.get("id"); // Đọc tham số 'd' hoặc 'id'

        if (compressedData && typeof LZString !== "undefined") {
            try {
                const decompressed = LZString.decompressFromEncodedURIComponent(compressedData);
                if (decompressed) {
                    const parts = decompressed.split('|');

                    // Giải nén line1 và line2 bằng Keypans
                    const line1Decrypted = decompressText(parts[0]);
                    const line2Decrypted = decompressText(parts[1]);
                    const heartParam = parts[2];
                    const musicParam = parts[3];

                    // Cập nhật textLines
                    if (line1Decrypted || line2Decrypted) {
                        const raw = [line1Decrypted, line2Decrypted].filter(Boolean).join("\n");
                        config.textLines = raw
                            .split(/\r?\n/)
                            .map((s) => s.trim())
                            .filter(Boolean);
                    }

                    if (heartParam) config.heart = heartParam;
                    if (musicParam) config.music = musicParam;
                }
            } catch (err) {
                console.error("Lỗi giải mã LZString:", err);
            }
        }

        // Xử lý phát nhạc nền
        if (config.music) {
            const btn = document.getElementById("playMusicBtn");
            if (btn) btn.style.display = "block";

            const audio = new Audio(config.music);
            audio.loop = true;

            let isPlaying = false;

            function updateIcon() {
                if (!btn) return;
                const icon = btn.querySelector("i");
                if (icon) {
                    if (isPlaying) {
                        icon.className = "fa-solid fa-volume-high";
                    } else {
                        icon.className = "fa-solid fa-volume-xmark";
                    }
                }
            }

            updateIcon();

            // ✅ Sự kiện click toàn cục để phát nhạc lần đầu
            function handleFirstInteraction() {
                if (!isPlaying) {
                    audio
                        .play()
                        .then(() => {
                            isPlaying = true;
                            updateIcon();
                        })
                        .catch((err) => {
                            console.warn("Không thể phát nhạc:", err);
                        });
                }

                // Chỉ chạy 1 lần
                document.removeEventListener("click", handleFirstInteraction);
            }

            document.addEventListener("click", handleFirstInteraction);

            // ✅ Nút điều khiển phát / dừng
            if (btn) {
                btn.onclick = (e) => {
                    e.stopPropagation();

                    if (!isPlaying) {
                        audio
                            .play()
                            .then(() => {
                                isPlaying = true;
                                updateIcon();
                            })
                            .catch((err) => {
                                console.warn("Không thể phát nhạc:", err);
                            });
                    } else {
                        audio.pause();
                        isPlaying = false;
                        updateIcon();
                    }
                };
            }
        }

        let dots = [];
        let targetDotsQueue = [];
        let currentCharIndex = 0;
        let animationDone = false;
        let bearY;

        // Generate dots for one char on offscreen canvas
        function generateCharDots(char, x, y) {
            const tempCanvas = document.createElement("canvas");
            tempCanvas.width = window.innerWidth;
            tempCanvas.height = window.innerHeight;
            const tctx = tempCanvas.getContext("2d");
            tctx.font = `bold ${config.fontSize}px ${config.fontFamily}`;
            tctx.fillText(char, x, y);
            const data = tctx.getImageData(
                0,
                0,
                tempCanvas.width,
                tempCanvas.height
            ).data;
            const arr = [];
            for (let yy = 0; yy < tempCanvas.height; yy += 6) {
                for (let xx = 0; xx < tempCanvas.width; xx += 4) {
                    const idx = (yy * tempCanvas.width + xx) * 4;
                    if (data[idx + 3] > 128) arr.push({ x: xx, y: yy });
                }
            }
            return arr;
        }

        // Generate all dots for all chars
        function generateAllTargetDots() {
            targetDotsQueue = [];
            const tctx = document.createElement("canvas").getContext("2d");
            tctx.font = `bold ${config.fontSize}px ${config.fontFamily}`;
            const startYRaw =
                (window.innerHeight - config.textLines.length * config.lineHeight) / 2;

            const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            const minMarginTop = isMobile ? 110 : 200;
            const startY = Math.max(startYRaw, minMarginTop);

            config.textLines.forEach((line, li) => {
                const lineWidth = tctx.measureText(line).width;
                let xCursor = (window.innerWidth - lineWidth) / 2;
                const y = startY + li * config.lineHeight;

                for (const ch of line) {
                    if (ch === " ") {
                        xCursor += tctx.measureText(" ").width;
                        targetDotsQueue.push([]);
                        continue;
                    }
                    const charDots = generateCharDots(ch, xCursor, y);
                    targetDotsQueue.push(charDots);
                    xCursor += tctx.measureText(ch).width;
                }
            });
        }

        // Shoot dots from bear to targets
        function shootDot() {
            if (animationDone) return;
            while (
                currentCharIndex < targetDotsQueue.length &&
                targetDotsQueue[currentCharIndex].length === 0
            ) {
                currentCharIndex++;
            }
            if (currentCharIndex >= targetDotsQueue.length) return;

            const targetDots = targetDotsQueue[currentCharIndex];
            for (let i = 0; i < config.shootPerTick; i++) {
                const t = targetDots.shift();
                if (!t) break;
                const angle = (Math.random() * Math.PI) / 6 - Math.PI / 12;
                const speed = 3 + Math.random() * 2;
                dots.push({
                    x: config.bearX + 40 + Math.random() * 20,
                    y: bearY - 20 + Math.random() * 10,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    targetX: t.x,
                    targetY: t.y,
                });
            }

            if (targetDots.length === 0) currentCharIndex++;
        }
        setInterval(shootDot, config.shootInterval);

        // Resize & reset all relevant elements
        function resize() {
            setTimeout(() => {
                const dpr = window.devicePixelRatio || 1;

                const w = window.innerWidth;
                const h = window.innerHeight;

                camera.aspect = w / h;
                camera.updateProjectionMatrix();

                renderer.setSize(w * dpr, h * dpr, false);
                renderer.domElement.style.width = `${w}px`;
                renderer.domElement.style.height = `${h}px`;

                overlayCanvas.width = w * dpr;
                overlayCanvas.height = h * dpr;
                overlayCanvas.style.width = `${w}px`;
                overlayCanvas.style.height = `${h}px`;

                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                ctx.scale(dpr, dpr);

                // 💡 Xử lý điều chỉnh font theo kích thước thật
                const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(
                    navigator.userAgent
                );

                if (w > h) {
                    config.fontSize = isMobile ? 60 : 100;
                    config.lineHeight = config.fontSize * 1.4;
                } else {
                    config.fontSize = 40;
                    config.lineHeight = 50;
                }

                bearY = h - 80;
                dots = [];
                currentCharIndex = 0;
                animationDone = false;
                generateAllTargetDots();
            }, 100);
        }

        window.addEventListener("resize", resize);
        resize();

        // === ANIMATION LOOP ===
        function animate() {
            requestAnimationFrame(animate);

            // Auto rotate starfield
            starField.rotation.y += autoRotateY;
            starField.rotation.x += autoRotateX;

            // Cập nhật vị trí sao băng
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const star = shootingStars[i];
                star.position.add(star.userData.velocity);

                // Xoá nếu ra ngoài màn hình
                if (Math.abs(star.position.x) > 1200) {
                    scene.remove(star);
                    shootingStars.splice(i, 1);
                }
            }

            renderer.render(scene, camera);

            // Draw heart dots
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            dots.forEach((dot) => {
                const dx = dot.targetX - dot.x;
                const dy = dot.targetY - dot.y;
                dot.vx += dx * 0.002;
                dot.vy += dy * 0.002;
                dot.vx *= 0.95;
                dot.vy *= 0.91;
                dot.x += dot.vx;
                dot.y += dot.vy;

                // ctx.font = "14px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(config.heart, dot.x, dot.y);
            });

            const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            const heartFontSize = isMobile
                ? window.innerWidth < 700
                    ? 16
                    : 10 // mobile nhỏ thì nhỏ hơn
                : 14; // desktop to hơn

            ctx.font = `${heartFontSize}px Arial`;

            // When animation done change bear gif
            if (
                !animationDone &&
                currentCharIndex >= targetDotsQueue.length &&
                dots.length > 0 &&
                dots.every(
                    (dot) =>
                        Math.abs(dot.targetX - dot.x) < 2 && Math.abs(dot.targetY - dot.y) < 2
                )
            ) {
                animationDone = true;
                setTimeout(() => {
                    bear.src = "./a/i/anh123.gif";
                }, 0);

                // 👉 Căn giữa theo chiều ngang
                const bearCenterX = innerWidth / 2 - bear.offsetWidth / 2;
                bear.style.left = `${bearCenterX}px`;
            }

            // Animate starfield opacity pulse
            starMat.opacity = 0.8 + 0.2 * Math.sin(Date.now() * 0.001);
        }

        animate();

        function checkOrientation() {
            const isPortrait = window.innerHeight > window.innerWidth;
            const warning = document.getElementById("portrait-warning");

            if (isPortrait) {
                warning.style.display = "flex";
            } else {
                warning.style.display = "none";
            }
        }

        window.addEventListener("resize", function () {
            const isPortrait = window.innerHeight > window.innerWidth;

            if (isPortrait) {
                // Chỉ reload khi chuyển sang dọc
                window.location.reload();
            }
        });

        // Kiểm tra ngay khi load và khi resize
        window.addEventListener("load", checkOrientation);
        window.addEventListener("resize", checkOrientation);
        window.addEventListener("orientationchange", checkOrientation);

        //=========Điều kiện========
        // if (!document.querySelector('meta[name="author"][content="Devpan"]'))

        //=========Chặn bôi đen========
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('contextmenu', e => e.preventDefault());
